{{- range $ns := .Values.watchNamespaces }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "cronbeat-agent.fullname" $ }}
  namespace: {{ $ns }}
  labels:
    {{- include "cronbeat-agent.labels" $ | nindent 4 }}
rules:
  {{- include "cronbeat-agent.rules" $ | nindent 2 }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "cronbeat-agent.fullname" $ }}
  namespace: {{ $ns }}
  labels:
    {{- include "cronbeat-agent.labels" $ | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "cronbeat-agent.fullname" $ }}
subjects:
  - kind: ServiceAccount
    name: {{ include "cronbeat-agent.serviceAccountName" $ }}
    namespace: {{ $.Release.Namespace }}
{{- end }}
